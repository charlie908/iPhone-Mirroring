name: PhoneViewVision
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    visionOS: "27.0"
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
targets:
  PhoneViewVision:
    type: application
    platform: visionOS
    sources:
      - PhoneViewVision
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.phoneview.vision
        PRODUCT_NAME: PhoneView
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: PhoneViewVision/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      gatherCoverageData: false
